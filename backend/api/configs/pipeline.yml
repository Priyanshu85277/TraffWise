labels:
  bus: 0
  car: 1
  motorbike: 2
  truck: 3

frame_skipper:
  target_fps: 60
  skip_rate: auto        # adaptive: drop just enough frames to keep real-time playback

tracker:
  type: bytetrack        # bytetrack | deepsort
  track_high_thresh: 0.25
  track_low_thresh: 0.1
  new_track_thresh: 0.25
  track_buffer: 30       # frames a lost track is kept before removal
  match_thresh: 0.8
  fuse_score: true
  frame_rate: 30

models:
  yolo11:
    path: api/data/models/one-stage/yolo11-noaugment.pt
    conf_threshold: 0.5
    iou_threshold: 0.5
  yolo26:
    path: api/data/models/one-stage/yolo26n.pt
    conf_threshold: 0.5
    iou_threshold: 0.5
  rtdetrv2:
    path: api/data/models/transformer-based/rtdetrv2-nano-resnet.pt
    conf_threshold: 0.5
    iou_threshold: 0.5
  faster_rcnn:
    path: api/data/models/two-stage/faster_rcnn.pt
    conf_threshold: 0.5
    iou_threshold: 0.5
  lp_detector:
    path: api/data/models/lp/LP_detection.pt
    conf_threshold: 0.5

samples:
  "1":
    video_path: api/data/samples/videos/cam_1.mp4
    annotation_path: api/data/samples/annotations/cam_1.yml
  "2":
    video_path: api/data/samples/videos/cam_2.mp4
    annotation_path: api/data/samples/annotations/cam_2.yml
  "3":
    video_path: api/data/samples/videos/cam_3.mp4
    annotation_path: api/data/samples/annotations/cam_3.yml
  "4":
    video_path: api/data/samples/videos/cam_4.mp4
    annotation_path: api/data/samples/annotations/cam_4.yml
  "5":
    video_path: api/data/samples/videos/cam_5.mp4
    annotation_path: api/data/samples/annotations/cam_5.yml
  "6":
    video_path: api/data/samples/videos/cam_6.mp4
    annotation_path: api/data/samples/annotations/cam_6.yml
  "7":
    video_path: api/data/samples/videos/cam_7.mp4
    annotation_path: api/data/samples/annotations/cam_7.yml
